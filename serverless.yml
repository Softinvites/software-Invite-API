    TERMII_WEBHOOK_SECRET: ${env:TERMII_WEBHOOK_SECRET, ''}
    SERVERLESS_LICENSE_KEY: ${env:SERVERLESS_LICENSE_KEY, 'eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJvcmdJZCI6IjdmYjQ0ZmY4LTQ5YmUtNGY0My1iMmM2LTliMzIyYmU5ZmQ3OSIsImlhdCI6MTc1NjM3MjU3NCwiZXhwIjoxNzg3OTA4NTc0LCJpc3MiOiJhcHAuc2VydmVybGVzcy5jb20ifQ.wxYOYIhN7zKm1zUY3l0RaHDnGOWKBqjdt9aPzjaiWZrMqhOxRWr8AD7Oy_-KQ-JnBu4ow1rKFqgFWc62EYwMY5XZvtCM91U-3lixSNMtqCyMhokEusEVM3IApNdQcl2fBS65RHGg1DVdWIVMGBBURMTDyy1DP0fhcINigjr08zP6iNeyjypdNp_az1TfDPZHVpAItKsIhk0sp0I9TBC_GPObgQ8gH9BK2guDNsEP92XJLoQaDCRXwlVemX3QjT3H6lEJBJjrzzAkOiDaGBd0TEHcpwbORdWKpZB9IRjmD0B6RVXU4W2azSGx8HEG3wHimraoUYXSG9Y9VOKEcpHq2w'}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:*
            - lambda:InvokeFunction
            - ses:SendEmail
            - ses:SendRawEmail
            - ses:SendBulkTemplatedEmail
            - ses:GetSendQuota
            - ses:GetAccount
          Resource: "*"

functions:
  app:
    handler: dist/index.handler
    layers:
      - arn:aws:lambda:us-east-2:402961397587:layer:Sharp2:1
    environment:
      RSVP_SCHEDULER_LAMBDA_NAME:
        Ref: RsvpSchedulerLambdaFunction
      QR_LAMBDA_FUNCTION_NAME:
        Ref: GenerateQrLambdaFunction
      IMPORT_LAMBDA_FUNCTION_NAME:
        Ref: ImportGuestsLambdaFunction
      ZIP_LAMBDA_FUNCTION_NAME:
        Ref: DownloadZipLambdaFunction
      EMAIL_LAMBDA_FUNCTION_NAME:
        Ref: SendEmailLambdaFunction
      RESEND_EMAILS_LAMBDA_FUNCTION_NAME:
        Ref: ResendEmailsLambdaFunction
      PNG_CONVERT_LAMBDA:
        Ref: PngConvertLambdaFunction
      WHATSAPP_LAMBDA_FUNCTION_NAME:
        Ref: SendWhatsAppLambdaFunction

    events:
      - httpApi:
          method: ANY
          path: /{proxy+}
    memorySize: 512
    timeout: 900

  backup:
    handler: dist/backup.handler
    description: "Event-driven MongoDB backup to S3"
    memorySize: 512
    timeout: 900
    environment:
      MONGODB_URI: ${env:MONGODB_URI, 'mongodb+srv://softinvites:Pi1pZr1yjuIcJ5pL@cluster1.f69gx.mongodb.net/softinvites'}
      BACKUP_BUCKET: ${env:BACKUP_BUCKET, 'softinvites-backups'}

  rsvpScheduler:
    handler: dist/lambda/rsvpSchedulerLambda/index.handler
    description: "Runs pending RSVP message schedules"
    memorySize: 512
    timeout: 900

    events:
      - schedule:
          # Was 5 minutes, which alone made every scheduled message up to 5
          # minutes late before any sending began. 1 minute cuts that floor.
          rate: rate(1 minute)
          enabled: true

  emailFeedback:
    handler: dist/lambda/emailFeedbackLambda/index.handler
    description: "Captures SES delivery, bounce, complaint, and reject diagnostics"
    memorySize: 256
    timeout: 900
    # SES publishes the configuration set's events to the default EventBridge bus.
    events:
      - schedule:
          rate: rate(10 minutes)
          enabled: true
      - eventBridge:
          pattern:
            source:
              - aws.ses
            detail-type:
              - Email Bounced
              - Email Complaint Received
              - Email Rejected
              - Email Delivered
              - Email Delivery Delayed
              - Email Rendering Failed

  sendWhatsApp:
    handler: dist/lambda/sendWhatsAppLambda/index.handler
    description: "Sends WhatsApp messages to event guests in batches"
    memorySize: 512
    timeout: 900

  importGuests:
    handler: dist/lambda/importGuestsLambda/index.handler
    description: "Imports guests from CSV/Excel and generates QR codes"
    memorySize: 512
    timeout: 900
    layers:
      - arn:aws:lambda:us-east-2:402961397587:layer:Sharp2:1
    environment:
      QR_LAMBDA_FUNCTION_NAME:
        Ref: GenerateQrLambdaFunction
      PNG_CONVERT_LAMBDA:
        Ref: PngConvertLambdaFunction
      EMAIL_LAMBDA_FUNCTION_NAME:
        Ref: SendEmailLambdaFunction

  generateQr:
    handler: dist/lambda/generateQrToS3/index.handler
    description: "Generates QR code SVGs and uploads them to S3"
    memorySize: 512
    timeout: 900

  downloadZip:
    handler: dist/lambda/downloadZipLambdaFunction/index.handler
    description: "Zips and streams guest QR code images from S3"
    memorySize: 512
    timeout: 900

  pngConvert:
    handler: dist/lambda/pngConvertLambda/index.handler
    description: "Converts SVG QR codes to PNG using Sharp"
    memorySize: 512
    timeout: 900
    layers:
      - arn:aws:lambda:us-east-2:402961397587:layer:Sharp2:1

  sendEmail:
    handler: dist/lambda/sendEmailLambda/index.handler
    description: "Sends individual email invitations via SES"
    memorySize: 512
    timeout: 900

  resendEmails:
    handler: dist/lambda/resendEmailsLambda/index.handler
    description: "Resends email invitations to a batch of guests"
    memorySize: 512
    timeout: 900
    environment:
      EMAIL_LAMBDA_FUNCTION_NAME:
        Ref: SendEmailLambdaFunction

  rsvpEmail:
    handler: dist/lambda/rsvpEmailLambda/index.handler
    description: "Sends RSVP confirmation emails via the email Lambda"
    memorySize: 512
    timeout: 900
    environment:
      EMAIL_LAMBDA_FUNCTION_NAME:
        Ref: SendEmailLambdaFunction

plugins:
  - serverless-plugin-dotenv
  - serverless-offline

package:
  patterns:
    - "!node_modules/.cache/**"
    - "!node_modules/**/*.md"
    - "!node_modules/lodash/fp/**"
    - "!.git/**"
    - "!.gitignore"
    - "!node_modules/sharp/**"
  individually: true

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    target: node22
    platform: node
    external:
      - sharp

custom:
  sesConfigurationSetName: ${self:service}-${sls:stage}-email-events
  dotenv:
    path: .env
  serverless-offline:
    httpPort: 4000
    noPrependStageInUrl: true

resources:
  Resources:
    # The configuration set the email sender already names in
    # SES_CONFIGURATION_SET_NAME; until now it did not exist, so SES sent
    # bounces only to the inbox (MAILER-DAEMON) and never to the platform.
    EmailEventsConfigurationSet:
      Type: AWS::SES::ConfigurationSet
      Properties:
        Name: softinvites-backend-dev-email-events
    EmailEventsEventBridgeDestination:
      Type: AWS::SES::ConfigurationSetEventDestination
      Properties:
        ConfigurationSetName: !Ref EmailEventsConfigurationSet
        EventDestination:
          Name: platform-feedback
          Enabled: true
          MatchingEventTypes:
            - bounce
            - complaint
            - reject
            - delivery
            - deliveryDelay
            - renderingFailure
          EventBridgeDestination:
            EventBusArn: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/default"
  Outputs:
    ServiceEndpoint:
      Description: URL of the service endpoint
      Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
