    WHATSAPP_SEND_CONCURRENCY: ${env:WHATSAPP_SEND_CONCURRENCY, '10'}
    WHATSAPP_SEND_DELAY_MS: ${env:WHATSAPP_SEND_DELAY_MS, '0'}
    SMS_DEFAULT_COUNTRY_CODE: ${env:SMS_DEFAULT_COUNTRY_CODE, '234'}
