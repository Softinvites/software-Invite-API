service: softinvites-backend
configValidationMode: error

# frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs22.x
  region: ${env:AWS_REGION, 'us-east-2'}
  apiGateway:
    binaryMediaTypes:
      - "image/png"
      - "image/jpeg"
      - "application/octet-stream"

  stage: ${env:STAGE, 'dev'}
  # architecture: arm64
  architecture: x86_64

  httpApi:
    cors:
      allowedOrigins:
        - ${env:FRONTEND_URL, 'https://www.softinvite.com'}
        - https://softinvite.com
        - https://softinvite-scan.vercel.app
        - http://localhost:3039
        # Brand website dev server (softinvites-web). In production the site is
        # served from softinvite.com itself, so it needs no separate entry.
        - http://localhost:3040
      allowCredentials: true
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-Amz-Date
        - X-Api-Key
      # API Gateway answers preflight itself, BEFORE the Lambda runs — so the
      # cors() middleware in src/index.ts cannot rescue a method missing here.
      # Anything the frontend sends must be listed.
      allowedMethods:
        - OPTIONS
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
      maxAge: 86400

  environment:
    NODE_ENV: ${env:NODE_ENV, 'production'}
    MONGODB_URI: ${env:MONGODB_URI, 'mongodb+srv://softinvites:Pi1pZr1yjuIcJ5pL@cluster1.f69gx.mongodb.net/softinvites?retryWrites=true&w=majority'}
    JWT_SECRET: ${env:JWT_SECRET, 'soft_invites363effbch7ee'}
    S3_BUCKET: ${env:S3_BUCKET, 'softinvites-assets'}
    REGION: ${env:AWS_REGION, 'us-east-2'}
    CDN_URL: ${env:CDN_URL, 'https://softinvites-assets.s3.amazonaws.com'}
    QR_LAMBDA_FUNCTION_NAME: ${env:QR_LAMBDA_FUNCTION_NAME, 'generateQrToS3'}
    IMPORT_LAMBDA_FUNCTION_NAME: ${env:IMPORT_LAMBDA_FUNCTION_NAME, 'importGuestsLambda'}
    ZIP_LAMBDA_FUNCTION_NAME: ${env:ZIP_LAMBDA_FUNCTION_NAME, 'downloadZipLambdaFunction'}
    SINGLE_QR_LAMBDA_FUNCTION_NAME: ${env:SINGLE_QR_LAMBDA_FUNCTION_NAME, 'downloadLambdaFunction'}
    EMAIL_LAMBDA_FUNCTION_NAME: ${env:EMAIL_LAMBDA_FUNCTION_NAME, 'sendEmailLambdaFunction'}
    RESEND_EMAILS_LAMBDA_FUNCTION_NAME: ${env:RESEND_EMAILS_LAMBDA_FUNCTION_NAME, 'resendEmailsLambdaFunction'}
    PNG_CONVERT_LAMBDA: ${env:PNG_CONVERT_LAMBDA, 'pngConvertLambda'}
    WHATSAPP_LAMBDA_FUNCTION_NAME: ${env:WHATSAPP_LAMBDA_FUNCTION_NAME, 'sendWhatsAppLambda'}
    FRONTEND_URL: ${env:FRONTEND_URL, 'https://www.softinvite.com'}
    BACKUP_BUCKET: ${env:BACKUP_BUCKET, 'softinvites-backups'}
    BACKUP_LAMBDA: ${env:BACKUP_LAMBDA, 'softinvites-backend-dev-backup'}
    EMAIL_FROM: ${env:EMAIL_FROM, 'SoftInvites <info@softinvite.com>'}
    ADMIN_EMAIL: ${env:ADMIN_EMAIL, 'softinvites@gmail.com'}
    SES_CONFIGURATION_SET_NAME: softinvites-backend-dev-email-events
    # WhatsApp (Twilio) provider config. These must be present in the serverless
    # app + scheduler environments (otherwise the code falls back to Meta).
    WHATSAPP_PROVIDER: ${env:WHATSAPP_PROVIDER, 'twilio'}
    TWILIO_ACCOUNT_SID: ${env:TWILIO_ACCOUNT_SID, ''}
    TWILIO_AUTH_TOKEN: ${env:TWILIO_AUTH_TOKEN, ''}
    TWILIO_WHATSAPP_FROM: ${env:TWILIO_WHATSAPP_FROM, 'whatsapp:+2349126995424'}
    TWILIO_WHATSAPP_STATUS_CALLBACK_URL: ${env:TWILIO_WHATSAPP_STATUS_CALLBACK_URL, 'https://292x833w13.execute-api.us-east-2.amazonaws.com/webhook/twilio/whatsapp/status'}
    TWILIO_WEBHOOK_BASE_URL: ${env:TWILIO_WEBHOOK_BASE_URL, 'https://292x833w13.execute-api.us-east-2.amazonaws.com'}
    TWILIO_DEFAULT_TEMPLATE_NAME: ${env:TWILIO_DEFAULT_TEMPLATE_NAME, 'rsvp_followup'}
    TWILIO_CONTENT_SID_WEDDING_INVITE: ${env:TWILIO_CONTENT_SID_WEDDING_INVITE, 'HXdffaac8f4c9a94b633cb07284fb01937'}
    TWILIO_CONTENT_SID_RSVP_FOLLOWUP: ${env:TWILIO_CONTENT_SID_RSVP_FOLLOWUP, 'HX451719b3635857ea63655cd47a79c012'}
    TWILIO_CONTENT_SID_EVENT_DETAILS_REMINDER: ${env:TWILIO_CONTENT_SID_EVENT_DETAILS_REMINDER, 'HX65f2325a08b31a5e4db1be1988c24a04'}
    TWILIO_CONTENT_SID_LOGISTICS: ${env:TWILIO_CONTENT_SID_LOGISTICS, 'HX1dfa30d9aef85cb8c2ba8026482d8595'}
    TWILIO_CONTENT_SID_RSVP_PARTY: ${env:TWILIO_CONTENT_SID_RSVP_PARTY, 'HX7d21a3c6b007bdc3717afd9d3b0fcdcd'}
    TWILIO_CONTENT_SID_RSVP_WEDDING: ${env:TWILIO_CONTENT_SID_RSVP_WEDDING, 'HX39277e789fe5d972cc4c775163ff3820'}
    TWILIO_CONTENT_SID_RSVP_FORM: ${env:TWILIO_CONTENT_SID_RSVP_FORM, 'HXba0058e3ed22e0ae4314c361e55cb3d3'}
